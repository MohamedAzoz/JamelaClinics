<form
  [formRoot]="filterForm"
  (submit)="apply(); $event.preventDefault()"
  class="rounded-2xl border border-text-muted/10 bg-surface p-4 shadow-sm"
  dir="rtl"
>
  <div class="mb-3 flex items-center gap-2 text-sm font-bold text-text">
    <fa-icon [icon]="faFilter" class="text-primary"></fa-icon><span>فلاتر التقرير والتحليل</span>
  </div>
  <div class="grid grid-cols-1 gap-3 md:grid-cols-2 xl:grid-cols-4">
    <label class="flex flex-col gap-1 text-xs font-semibold text-text"
      >نوع المصروف
      <select
        [formField]="filterForm.type"
        class="rounded-xl border border-text-muted/15 bg-main-bg px-3 py-2.5 text-sm text-text outline-none focus:border-primary focus:ring-2 focus:ring-primary/20"
      >
        <option value="">كل الأنواع</option>
        <option [value]="TreasuryType.Income">الإيرادات</option>
        <option [value]="TreasuryType.Expense">المصروفات</option>
      </select>
    </label>
    <label class="flex flex-col gap-1 text-xs font-semibold text-text"
      >الفترة
      <select
        [formField]="filterForm.period"
        class="rounded-xl border border-text-muted/15 bg-main-bg px-3 py-2.5 text-sm text-text outline-none focus:border-primary focus:ring-2 focus:ring-primary/20"
      >
        <option value="">اختر فترة</option>
        <option [value]="TreasuryPeriod.Today">اليوم</option>
        <option [value]="TreasuryPeriod.ThisMonth">هذا الشهر</option>
        <option [value]="TreasuryPeriod.ThisYear">هذا العام</option>
      </select>
    </label>
    <label class="flex flex-col gap-1 text-xs font-semibold text-text"
      >من تاريخ<input
        type="date"
        [formField]="filterForm.fromDate"
        class="rounded-xl border border-text-muted/15 bg-main-bg px-3 py-2.5 text-sm text-text outline-none focus:border-primary focus:ring-2 focus:ring-primary/20"
    /></label>
    <label class="flex flex-col gap-1 text-xs font-semibold text-text"
      >إلى تاريخ<input
        type="date"
        [formField]="filterForm.toDate"
        class="rounded-xl border border-text-muted/15 bg-main-bg px-3 py-2.5 text-sm text-text outline-none focus:border-primary focus:ring-2 focus:ring-primary/20"
    /></label>
  </div>
  <div class="mt-4 flex flex-wrap items-center justify-end gap-2">
    <button
      type="button"
      (click)="resetAll()"
      class="inline-flex items-center gap-2 rounded-xl border border-text-muted/15 px-4 py-2 text-xs font-semibold text-text transition hover:bg-main-bg"
    >
      <fa-icon [icon]="faRotateLeft"></fa-icon><span>إعادة ضبط</span>
    </button>
    <button
      type="submit"
      class="rounded-xl bg-primary px-5 py-2 text-xs font-semibold text-white transition hover:bg-primary-dark"
    >
      تطبيق الفلاتر
    </button>
  </div>
</form>
