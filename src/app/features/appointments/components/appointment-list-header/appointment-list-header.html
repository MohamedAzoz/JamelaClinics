<div class="space-y-6 mb-6">
  <!-- Top Banner Header -->
  <div
    class="relative overflow-hidden rounded-2xl bg-sidebar-bg/90 p-6 md:p-8 text-sidebar-text shadow-xl"
  >
    <!-- Decorative Blurs -->
    <div
      class="absolute -right-10 -top-10 h-44 w-44 rounded-full bg-white/10 blur-2xl pointer-events-none"
    ></div>
    <div
      class="absolute -left-10 -bottom-10 h-44 w-44 rounded-full bg-accent/20 blur-2xl pointer-events-none"
    ></div>

    <div class="relative z-10 flex flex-col lg:flex-row lg:items-center justify-between gap-6">
      <!-- Title & Details -->
      <div class="flex items-start gap-4">
        <div
          class="flex h-8 w-8 md:h-10 md:w-10 lg:h-14 lg:w-14 shrink-0 items-center justify-center rounded-2xl bg-white/15 backdrop-blur-md border border-white/20 shadow-inner"
        >
          <fa-icon
            [icon]="faCalendarCheck"
            class="text-lg md:text-xl lg:text-2xl text-accent"
          ></fa-icon>
        </div>
        <div>
          <div class="flex items-center gap-2 mb-1">
            <h1 class="text-base md:text-lg lg:text-xl font-semibold tracking-tight text-white">
              إدارة وحجوزات المرضى
            </h1>
          </div>
          <p class="text-xs sm:text-sm md:text-base text-white/80 font-medium">
            استعراض جميع الحجوزات المسجلة، تصفية المواعيد حسب الأطباء والفترات، وتصدير التقارير
          </p>
        </div>
      </div>

      <!-- Action Buttons -->
      <div class="flex flex-wrap items-center gap-3 self-start lg:self-auto">
        <button
          type="button"
          (click)="facade.exportAppointmentsExcel()"
          [disabled]="facade.isExportingExcel()"
          class="flex items-center text-xs md:text-sm lg:text-base gap-2 rounded-xl bg-white/15 backdrop-blur-md px-5 py-2.5 font-semibold text-white border border-white/25 hover:bg-white/25 focus:outline-none transition disabled:opacity-50 disabled:cursor-not-allowed"
        >
          @if (facade.isExportingExcel()) {
            <fa-icon [icon]="faSpinner" class="animate-spin text-accent"></fa-icon>
            <span>جاري التصدير...</span>
          } @else {
            <fa-icon [icon]="faFileExcel" class="text-success"></fa-icon>
            <span>تصدير إلى إكسل</span>
          }
        </button>
      </div>
    </div>
  </div>
</div>
