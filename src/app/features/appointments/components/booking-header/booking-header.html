<div class="relative overflow-hidden rounded-2xl bg-sidebar-bg p-6 md:p-8 text-white shadow-xl mb-6">
  <!-- Background Decorative Shapes -->
  <div class="absolute -right-10 -top-10 h-40 w-40 rounded-full bg-white/10 blur-2xl pointer-events-none"></div>
  <div class="absolute -left-10 -bottom-10 h-40 w-40 rounded-full bg-accent/20 blur-2xl pointer-events-none"></div>

  <div class="relative z-10 flex flex-col md:flex-row md:items-center justify-between gap-4">
    <!-- Header Title & Description -->
    <div class="flex items-start gap-4">
      <div class="flex h-14 w-14 shrink-0 items-center justify-center rounded-2xl bg-white/15 backdrop-blur-md border border-white/20 shadow-inner">
        <fa-icon [icon]="faCalendarPlus" class="text-2xl text-accent"></fa-icon>
      </div>
      <div>
        <div class="flex items-center gap-2 mb-1">
          <h1 class="text-2xl font-bold tracking-tight md:text-3xl text-white">حجز موعد جديد للمريض</h1>
          <span class="inline-flex items-center gap-1 rounded-full bg-white/20 px-3 py-0.5 text-xs font-semibold text-white/90 border border-white/25">
            <fa-icon [icon]="faHospitalUser" class="text-[10px]"></fa-icon>
            قسم الاستقبال
          </span>
        </div>
        <p class="text-sm md:text-base text-white/80 font-medium">
          اختر الطبيب وتاريخ الموعد المتاح لتسجيل حجز مريض جديد بسهولة ودقة في النظام
        </p>
      </div>
    </div>

    <!-- Quick Stats / Indicators -->
    <div class="flex items-center gap-3 self-start md:self-auto pt-2 md:pt-0">
      <div class="flex items-center gap-2 rounded-xl bg-white/10 backdrop-blur-md px-4 py-2 border border-white/15">
        <fa-icon [icon]="faClock" class="text-accent"></fa-icon>
        <span class="text-xs text-white/90 font-semibold">حجز مباشر أونلاين</span>
      </div>
      <div class="flex items-center gap-2 rounded-xl bg-white/10 backdrop-blur-md px-4 py-2 border border-white/15">
        <fa-icon [icon]="faUserCheck" class="text-success"></fa-icon>
        <span class="text-xs text-white/90 font-semibold">تأكيد فوري</span>
      </div>
    </div>
  </div>
</div>
