@if (facade.totalCount() > 0) {
  <div class="flex flex-col sm:flex-row items-center justify-between gap-4 rounded-2xl bg-surface p-4 shadow-sm border border-primary/10">
    <!-- Items per page & Total Info -->
    <div class="flex items-center gap-3 text-xs text-text-muted">
      <span>عرض</span>
      <select
        [value]="facade.pageSize()"
        (change)="onPageSizeChange($event)"
        class="rounded-xl border border-primary/20 bg-main-bg px-2.5 py-1 text-xs font-bold text-text focus:border-primary focus:outline-none focus:ring-2 focus:ring-primary/20"
      >
        <option [value]="10">10</option>
        <option [value]="20">20</option>
        <option [value]="50">50</option>
        <option [value]="100">100</option>
      </select>
      <span>عنصر لكل صفحة</span>

      <span class="border-r border-primary/10 pr-3 font-medium">
        إجمالي النتائج: <strong class="text-text font-mono">{{ facade.totalCount() }}</strong> حجز
      </span>
    </div>

    <!-- Page Number Navigation Buttons -->
    <div class="flex items-center gap-1.5">
      <!-- Previous Page -->
      <button
        type="button"
        (click)="onPageSelect(facade.pageNumber() - 1)"
        [disabled]="facade.pageNumber() <= 1"
        class="flex h-8 w-8 items-center justify-center rounded-xl border border-primary/20 bg-main-bg text-text-muted hover:bg-primary/10 hover:text-primary disabled:opacity-40 disabled:cursor-not-allowed transition"
      >
        <fa-icon [icon]="faChevronRight" class="text-xs"></fa-icon>
      </button>

      <!-- Page Numbers -->
      @for (p of pagesList(); track p) {
        <button
          type="button"
          (click)="onPageSelect(p)"
          [class.bg-primary]="facade.pageNumber() === p"
          [class.text-white]="facade.pageNumber() === p"
          [class.bg-main-bg]="facade.pageNumber() !== p"
          [class.text-text-muted]="facade.pageNumber() !== p"
          class="flex h-8 w-8 items-center justify-center rounded-xl border border-primary/20 text-xs font-bold transition hover:bg-primary hover:text-white"
        >
          {{ p }}
        </button>
      }

      <!-- Next Page -->
      <button
        type="button"
        (click)="onPageSelect(facade.pageNumber() + 1)"
        [disabled]="facade.pageNumber() >= facade.totalPages()"
        class="flex h-8 w-8 items-center justify-center rounded-xl border border-primary/20 bg-main-bg text-text-muted hover:bg-primary/10 hover:text-primary disabled:opacity-40 disabled:cursor-not-allowed transition"
      >
        <fa-icon [icon]="faChevronLeft" class="text-xs"></fa-icon>
      </button>
    </div>
  </div>
}
