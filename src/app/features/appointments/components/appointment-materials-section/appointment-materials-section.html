<section class="rounded-2xl border border-primary/10 bg-surface p-5 shadow-sm" dir="rtl">
  <div
    class="mb-4 flex flex-col sm:flex-row items-start sm:items-center justify-between gap-3 border-b border-primary/10 pb-3"
  >
    <div class="flex items-center gap-3">
      <div class="flex h-10 w-10 items-center justify-center rounded-xl bg-accent/10 text-accent">
        <fa-icon [icon]="faBoxOpen" class="text-base"></fa-icon>
      </div>
      <div>
        <h3 class="text-sm font-bold text-text">المستلزمات والخدمات المضافة</h3>
        <p class="text-[11px] text-text-muted">
          إدارة بيان وتكلفة المستلزمات والخدمات المستخدمة للموعد
        </p>
      </div>
    </div>
    @if (hasMaterials() && !facade.isAdminOrAccountant() && !chackStatus() ) {
      <button
        type="button"
        (click)="clearMaterials()"
        [disabled]="facade.isClearingMaterials()"
        class="inline-flex items-center gap-2 rounded-xl border border-danger/20 bg-danger/5 px-3 py-1.5 text-xs font-bold text-danger hover:bg-danger/10 transition cursor-pointer disabled:opacity-50"
      >
        @if (facade.isClearingMaterials()) {
          <fa-icon [icon]="faSpinner" class="animate-spin text-xs"></fa-icon>
        } @else {
          <fa-icon [icon]="faTrashAlt" class="text-xs"></fa-icon>
        }
        <span>مسح المستلزمات</span>
      </button>
    }
  </div>
  @if (!facade.isAdminOrAccountant() && !chackStatus()) {
    <form (submit)="saveMaterials($event)" class="space-y-4">
      <div class="grid grid-cols-1 md:grid-cols-12 gap-4">
        <div class="md:col-span-8">
          <label for="materialsDescription" class="mb-1 block text-xs font-semibold text-text">
            بيان المستلزمات والخدمات
          </label>
          <textarea
            id="materialsDescription"
            rows="3"
            [ngModel]="materialsDescription()"
            (ngModelChange)="materialsDescription.set($event)"
            name="materialsDescription"
            placeholder="أدخل التفاصيل والخدمات والمستلزمات..."
            class="w-full rounded-xl border border-primary/20 bg-main-bg p-3 text-xs focus-visible:outline-2 focus-visible:outline-primary"
          ></textarea>
        </div>

        <div class="md:col-span-4 space-y-4">
          <div>
            <label for="totalMaterialsCost" class="mb-1 block text-xs font-semibold text-text">
              إجمالي تكلفة المستلزمات (ج.م)
            </label>
            <input
              id="totalMaterialsCost"
              type="number"
              min="0"
              step="0.01"
              [ngModel]="totalMaterialsCost()"
              (ngModelChange)="totalMaterialsCost.set($event)"
              name="totalMaterialsCost"
              class="min-h-11 w-full rounded-xl border border-primary/20 bg-main-bg px-3 text-xs focus-visible:outline-2 focus-visible:outline-primary font-mono"
            />
          </div>

          <button
            type="submit"
            [disabled]="facade.isUpdatingMaterials()"
            class="inline-flex min-h-11 w-full items-center justify-center gap-2 rounded-xl bg-primary px-4 text-xs font-bold text-white transition hover:bg-primary-dark disabled:opacity-50 cursor-pointer shadow-sm"
          >
            @if (facade.isUpdatingMaterials()) {
              <fa-icon [icon]="faSpinner" class="animate-spin text-xs"></fa-icon>
              <span>جاري الحفظ...</span>
            } @else {
              <fa-icon [icon]="faSave" class="text-xs"></fa-icon>
              <span>حفظ المستلزمات</span>
            }
          </button>
        </div>
      </div>
    </form>
  }
</section>
