<div class="rounded-2xl bg-surface p-5 shadow-sm border border-primary/10 mb-6">
  <div class="flex flex-col lg:flex-row items-stretch lg:items-center justify-between gap-4">
    <!-- Period Preset Tabs -->
    <div class="flex flex-wrap items-center gap-1.5 overflow-x-auto pb-1 lg:pb-0">
      <span class="text-xs font-bold text-text-muted pl-2 flex items-center gap-1">
        <fa-icon [icon]="faCalendarAlt" class="text-primary"></fa-icon>
        الفترة:
      </span>

      <button
        type="button"
        (click)="onPeriodSelect(undefined)"
        [class.bg-primary]="facade.periodFilter() === undefined && !facade.fromDateFilter()"
        [class.text-white]="facade.periodFilter() === undefined && !facade.fromDateFilter()"
        [class.bg-main-bg]="facade.periodFilter() !== undefined || facade.fromDateFilter()"
        [class.text-text-muted]="facade.periodFilter() !== undefined || facade.fromDateFilter()"
        class="rounded-xl px-3.5 py-2 text-xs font-bold transition hover:bg-primary hover:text-white cursor-pointer"
      >
        كافة الفترات
      </button>

      <button
        type="button"
        (click)="onPeriodSelect(PeriodEnum.Today)"
        [class.bg-primary]="facade.periodFilter() === PeriodEnum.Today"
        [class.text-white]="facade.periodFilter() === PeriodEnum.Today"
        [class.bg-main-bg]="facade.periodFilter() !== PeriodEnum.Today"
        [class.text-text-muted]="facade.periodFilter() !== PeriodEnum.Today"
        class="rounded-xl px-3.5 py-2 text-xs font-bold transition hover:bg-primary hover:text-white cursor-pointer"
      >
        مواعيد اليوم
      </button>

      <button
        type="button"
        (click)="onPeriodSelect(PeriodEnum.ThisMonth)"
        [class.bg-primary]="facade.periodFilter() === PeriodEnum.ThisMonth"
        [class.text-white]="facade.periodFilter() === PeriodEnum.ThisMonth"
        [class.bg-main-bg]="facade.periodFilter() !== PeriodEnum.ThisMonth"
        [class.text-text-muted]="facade.periodFilter() !== PeriodEnum.ThisMonth"
        class="rounded-xl px-3.5 py-2 text-xs font-bold transition hover:bg-primary hover:text-white cursor-pointer"
      >
        هذا الشهر
      </button>

      <button
        type="button"
        (click)="onPeriodSelect(PeriodEnum.ThisYear)"
        [class.bg-primary]="facade.periodFilter() === PeriodEnum.ThisYear"
        [class.text-white]="facade.periodFilter() === PeriodEnum.ThisYear"
        [class.bg-main-bg]="facade.periodFilter() !== PeriodEnum.ThisYear"
        [class.text-text-muted]="facade.periodFilter() !== PeriodEnum.ThisYear"
        class="rounded-xl px-3.5 py-2 text-xs font-bold transition hover:bg-primary hover:text-white cursor-pointer"
      >
        هذا العام
      </button>
    </div>

    <!-- Custom Date Range & Reset Button -->
    <div class="flex flex-wrap items-center gap-2">
      <div class="flex items-center gap-2 bg-main-bg/60 p-1.5 rounded-xl border border-primary/10">
        <span class="text-xs text-text-muted font-medium pr-1">من:</span>
        <input
          type="date"
          [value]="fromDate()"
          (input)="fromDate.set($any($event.target).value)"
          class="rounded-lg border border-primary/20 bg-surface px-2.5 py-1 text-xs font-medium text-text transition focus:border-primary focus:outline-none focus:ring-2 focus:ring-primary/20"
        />

        <span class="text-xs text-text-muted font-medium">إلى:</span>
        <input
          type="date"
          [value]="toDate()"
          (input)="toDate.set($any($event.target).value)"
          class="rounded-lg border border-primary/20 bg-surface px-2.5 py-1 text-xs font-medium text-text transition focus:border-primary focus:outline-none focus:ring-2 focus:ring-primary/20"
        />

        <button
          type="button"
          (click)="onDateRangeApply()"
          class="rounded-lg bg-primary px-3 py-1 text-xs font-bold text-white hover:bg-primary-dark transition cursor-pointer"
        >
          تطبيق
        </button>
      </div>

      <button
        type="button"
        (click)="resetAll()"
        title="إعادة ضبط الفلاتر"
        class="flex h-9 w-9 items-center justify-center rounded-xl border border-danger/30 bg-danger/5 text-danger hover:bg-danger/15 transition cursor-pointer"
      >
        <fa-icon [icon]="faUndo" class="text-xs"></fa-icon>
      </button>
    </div>
  </div>
</div>
