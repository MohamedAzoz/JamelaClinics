<main
  class="flex flex-col items-center justify-center min-h-full p-4 sm:p-6 md:p-8 text-text transition-colors duration-300"
  dir="rtl"
>
  <!-- Page Card -->
  <div class="w-full max-w-lg">
    <!-- Premium Header -->
    <div class="mb-8 flex flex-col gap-1.5">
      <h1 class="text-xl sm:text-2xl font-semibold text-text tracking-tight leading-tight">
        تغيير كلمة المرور
      </h1>
      <p class="text-xs sm:text-sm text-text-muted max-w-md">
        قم بتحديث كلمة مرور حسابك بشكل دوري للحفاظ على أعلى مستويات الأمان.
      </p>
    </div>

    <!-- Card Container -->
    <div
      class="bg-surface rounded-2xl border border-slate-200/80 dark:border-slate-800/80 shadow-lg overflow-hidden relative"
    >
      <!-- Top accent bar -->
      <div class="h-1 w-full bg-linear-to-r from-primary via-accent to-primary/40"></div>

      <!-- Ambient background glow (decorative) -->
      <div
        class="absolute -inset-s-16 -top-16 w-48 h-48 bg-primary/5 rounded-full blur-3xl pointer-events-none"
        aria-hidden="true"
      ></div>
      <div
        class="absolute -inset-e-12 -bottom-12 w-40 h-40 bg-accent/5 rounded-full blur-2xl pointer-events-none"
        aria-hidden="true"
      ></div>

      <!-- Card Content -->
      <div class="relative p-6 sm:p-8">
        <!-- Card Icon Header -->
        <div class="flex items-center gap-4 mb-7">
          <div
            class="w-12 h-12 rounded-xl bg-primary/10 text-primary dark:text-accent flex items-center justify-center shrink-0 shadow-inner"
          >
            <fa-icon [icon]="faShieldHalved" size="xl"></fa-icon>
          </div>
          <div>
            <h2 class="font-bold text-text text-base sm:text-lg">أمان الحساب</h2>
            <p class="text-xs sm:text-sm text-text-muted">
              يُنصح باختيار كلمة مرور فريدة لا تُستخدم في أي حساب آخر
            </p>
          </div>
        </div>

        <!-- Change Password Form Component -->
        <app-change-password-form></app-change-password-form>
      </div>
    </div>
  </div>
</main>
