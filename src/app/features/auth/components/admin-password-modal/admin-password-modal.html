@if (facade.isAdminPasswordModalOpen() && facade.selectedManagedUser(); as user) {
  <div
    class="fixed inset-0 z-50 flex items-center justify-center bg-sidebar-bg/75 p-4 backdrop-blur-sm"
    dir="rtl"
    role="dialog"
    aria-modal="true"
    aria-labelledby="admin-password-title"
  >
    <div
      class="w-full max-w-lg overflow-hidden rounded-3xl border border-primary/10 bg-surface shadow-2xl"
    >
      <div
        class="relative overflow-hidden border-b border-primary/10 bg-main-bg/70 px-5 py-5 sm:px-7"
      >
        <div
          class="absolute -top-10 -inset-s-8 h-28 w-28 rounded-full bg-accent/10 blur-2xl"
          aria-hidden="true"
        ></div>
        <div class="relative flex items-start justify-between gap-4">
          <div class="flex items-center gap-3">
            <div
              class="flex h-11 w-11 items-center justify-center rounded-2xl bg-primary/10 text-primary"
            >
              <fa-icon [icon]="faKey"></fa-icon>
            </div>
            <div>
              <h2 id="admin-password-title" class="font-extrabold text-text">تغيير كلمة المرور</h2>
              <p class="mt-1 text-xs text-text-muted">
                تحديث كلمة مرور <strong class="text-primary">{{ user.fullName }}</strong>
              </p>
            </div>
          </div>
          <button
            type="button"
            (click)="close()"
            class="rounded-xl p-2 text-text-muted transition hover:bg-danger/10 hover:text-danger"
            aria-label="إغلاق"
          >
            <fa-icon [icon]="faXmark"></fa-icon>
          </button>
        </div>
      </div>
      <form
        [formRoot]="passwordForm"
        (submit)="submit($event)"
        class="flex flex-col gap-5 p-5 sm:p-7"
        novalidate
      >
        <div class="rounded-2xl border border-primary/10 bg-primary/5 p-4 text-xs text-text-muted">
          سيتم تطبيق كلمة المرور الجديدة على حساب
          <strong class="text-text">{{ user.fullName }}</strong> مباشرة.
        </div>
        <label for="admin-new-password">
          <div class="flex items-center gap-1">
            <p class="text-xs font-bold text-text">كلمة المرور الجديدة</p>
            <span class="text-red-500">*</span>
          </div>
          <div class="relative">
            <input
              id="admin-new-password"
              [type]="showPassword() ? 'text' : 'password'"
              [formField]="passwordForm.newPassword"
              autocomplete="new-password"
              class="w-full rounded-xl border border-text-muted/15 bg-main-bg px-4 py-3 pe-11 text-sm text-text outline-none transition focus:border-primary focus:ring-2 focus:ring-primary/20"
              placeholder="أدخل كلمة مرور قوية"
            />
            <button
              type="button"
              (click)="showPassword.update((value) => !value)"
              class="absolute inset-y-0 inset-e-0 flex w-11 items-center justify-center text-text-muted hover:text-primary"
              [attr.aria-label]="showPassword() ? 'إخفاء كلمة المرور' : 'إظهار كلمة المرور'"
            >
              <fa-icon [icon]="showPassword() ? faEyeSlash : faEye"></fa-icon>
            </button>
          </div>
          @if (passwordForm.newPassword().touched() && passwordForm.newPassword().invalid()) {
            @for (error of passwordForm.newPassword().errors(); track error.message) {
              <span class="text-xs text-danger" role="alert">{{ error.message }}</span>
            }
          }
        </label>
        <div
          class="flex flex-col-reverse gap-2 border-t border-text-muted/10 pt-4 sm:flex-row sm:justify-end"
        >
          <button
            type="button"
            (click)="close()"
            [disabled]="facade.adminPasswordLoading()"
            class="rounded-xl border border-text-muted/15 px-5 py-2.5 text-xs font-bold text-text transition hover:bg-main-bg disabled:opacity-50"
          >
            إلغاء</button
          ><button
            type="submit"
            [disabled]="facade.adminPasswordLoading()"
            class="inline-flex items-center justify-center gap-2 rounded-xl bg-primary px-5 py-2.5 text-xs font-bold text-white transition hover:bg-primary-dark disabled:opacity-50"
          >
            @if (facade.adminPasswordLoading()) {
              <fa-icon [icon]="faSpinner" class="animate-spin"></fa-icon><span>جاري الحفظ...</span>
            } @else {
              <fa-icon [icon]="faCheck"></fa-icon><span>حفظ كلمة المرور</span>
            }
          </button>
        </div>
      </form>
    </div>
  </div>
}
