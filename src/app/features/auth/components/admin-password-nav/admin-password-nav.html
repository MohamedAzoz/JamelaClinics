<header class="flex flex-col gap-5" dir="rtl">
  <section
    class="relative overflow-hidden rounded-3xl border border-primary/10 bg-surface p-5 shadow-sm sm:p-7"
  >
    <div
      class="absolute -top-20 -inset-s-10 h-44 w-44 rounded-full bg-accent/10 blur-3xl"
      aria-hidden="true"
    ></div>
    <div class="relative flex flex-col gap-5 lg:flex-row lg:items-center lg:justify-between">
      <div class="flex items-center gap-4">
        <div
          class="flex h-14 w-14 shrink-0 items-center justify-center rounded-2xl bg-primary/10 text-primary shadow-inner"
        >
          <fa-icon [icon]="faKey" size="xl"></fa-icon>
        </div>
        <div>
          <p class="mb-1 text-xs font-bold tracking-wide text-accent">مركز التحكم الإداري</p>
          <h1 class="text-xl font-extrabold text-text sm:text-2xl">إدارة كلمات المرور</h1>
          <p class="mt-1 text-xs text-text-muted sm:text-sm">
            اختر الفئة لإدارة وصول المستخدمين بأمان
          </p>
        </div>
      </div>

      <nav
        class="grid grid-cols-2 gap-2 rounded-2xl border border-primary/10 bg-main-bg/70 p-1.5"
        aria-label="نوع المستخدم"
      >
        <button
          type="button"
          (click)="selectType('doctors')"
          [class.bg-primary]="facade.managedUserType() === 'doctors'"
          [class.text-white]="facade.managedUserType() === 'doctors'"
          [class.text-text-muted]="facade.managedUserType() !== 'doctors'"
          class="inline-flex min-w-32 items-center justify-center gap-2 rounded-xl px-4 py-2.5 text-xs font-bold transition hover:bg-primary hover:text-white sm:text-sm"
          aria-label="عرض الأطباء"
        >
          <fa-icon [icon]="faUserDoctor"></fa-icon><span>الأطباء</span>
        </button>
        <button
          type="button"
          (click)="selectType('employees')"
          [class.bg-primary]="facade.managedUserType() === 'employees'"
          [class.text-white]="facade.managedUserType() === 'employees'"
          [class.text-text-muted]="facade.managedUserType() !== 'employees'"
          class="inline-flex min-w-32 items-center justify-center gap-2 rounded-xl px-4 py-2.5 text-xs font-bold transition hover:bg-primary hover:text-white sm:text-sm"
          aria-label="عرض الموظفين"
        >
          <fa-icon [icon]="faUsers"></fa-icon><span>الموظفون</span>
        </button>
      </nav>
    </div>
  </section>
</header>
