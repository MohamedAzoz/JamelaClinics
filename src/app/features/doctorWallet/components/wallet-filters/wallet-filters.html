<section
  aria-labelledby="wallet-filters-title"
  class="rounded-2xl border border-primary/10 bg-surface p-5 shadow-sm"
>
  <div class="mb-4 flex items-center justify-between gap-3 border-b border-primary/10 pb-3">
    <h2 id="wallet-filters-title" class="flex items-center gap-2 text-sm font-bold text-text">
      <fa-icon [icon]="faFilter" class="text-primary" /> تصفية الحركات المالية
    </h2>
    <button
      type="button"
      (click)="reset()"
      class="flex min-h-9 items-center gap-2 rounded-xl border border-primary/20 px-3 py-2 text-xs font-semibold text-text hover:bg-main-bg"
    >
      <fa-icon [icon]="faRotateLeft" /> إعادة ضبط
    </button>
  </div>
  <div
    class="grid grid-cols-1 items-end gap-4 md:grid-cols-2"
    [class]="facade.canManage() ? 'xl:grid-cols-[1fr_1fr_2fr]' : ''"
  >
    @if (facade.canManage()) {
      <label class="flex flex-col gap-2 text-xs font-bold text-text">
        الطبيب
        <select
          [value]="facade.doctorIdFilter()"
          (change)="selectDoctor($event)"
          [disabled]="facade.loadingDoctors()"
          class="min-h-10 w-full rounded-xl border border-primary/20 bg-surface px-3 py-2 text-sm text-text focus:border-primary focus:ring-2 focus:ring-primary/20"
        >
          <option value="">
            {{ facade.loadingDoctors() ? 'جاري تحميل الأطباء...' : 'جميع الأطباء' }}
          </option>
          @for (doctor of facade.doctors(); track doctor.userId) {
            <option [value]="doctor.userId">{{ doctor.fullName }} — {{ doctor.clinicName }}</option>
          }
        </select>
      </label>
    }
    <label class="flex flex-col gap-2 text-xs font-bold text-text">
      الفترة
      <select
        [value]="facade.periodFilter() ?? ''"
        (change)="selectPeriod($event)"
        class="min-h-10 w-full rounded-xl border border-primary/20 bg-surface px-3 py-2 text-sm text-text focus:border-primary focus:ring-2 focus:ring-primary/20"
      >
        <option value="">جميع الفترات</option>
        <option [value]="Period.Today">اليوم</option>
        <option [value]="Period.ThisMonth">هذا الشهر</option>
        <option [value]="Period.ThisYear">هذا العام</option>
      </select>
    </label>
    <form (submit)="applyDates($event)" class="flex flex-wrap items-end gap-2">
      <label class="flex min-w-0 flex-1 flex-col gap-2 text-xs font-bold text-text"
        >من تاريخ
        <input
          type="date"
          [formField]="dateForm.fromDate"
          [max]="dates().toDate || ''"
          [attr.aria-invalid]="invalidRange()"
          [attr.aria-describedby]="invalidRange() ? 'wallet-date-error' : null"
          class="min-h-10 min-w-0 rounded-xl border border-primary/20 bg-surface px-2 py-2 text-sm text-text focus:border-primary focus:ring-2 focus:ring-primary/20"
        />
      </label>
      <label class="flex min-w-0 flex-1 flex-col gap-2 text-xs font-bold text-text"
        >إلى تاريخ
        <input
          type="date"
          [formField]="dateForm.toDate"
          [min]="dates().fromDate || ''"
          [attr.aria-invalid]="invalidRange()"
          [attr.aria-describedby]="invalidRange() ? 'wallet-date-error' : null"
          class="min-h-10 min-w-0 rounded-xl border border-primary/20 bg-surface px-2 py-2 text-sm text-text focus:border-primary focus:ring-2 focus:ring-primary/20"
        />
      </label>
      <button
        type="submit"
        [disabled]="invalidRange()"
        class="min-h-10 rounded-xl bg-primary px-4 py-2 text-sm font-bold text-white hover:bg-primary-dark disabled:opacity-50"
      >
        تطبيق
      </button>
    </form>
  </div>
  @if (invalidRange()) {
    <p id="wallet-date-error" role="alert" class="mt-3 text-sm text-text">
      يجب أن يكون تاريخ البداية قبل تاريخ النهاية أو مساويًا له.
    </p>
  }
  @if (facade.canManage() && facade.doctorsError()) {
    <p role="alert" class="mt-3 text-sm text-text">
      {{ facade.doctorsError() }}
      <button
        type="button"
        (click)="facade.loadDoctors()"
        class="rounded-lg px-3 py-2 font-bold underline"
      >
        إعادة المحاولة
      </button>
    </p>
  }
</section>
