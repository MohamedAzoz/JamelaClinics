<div
  class="flex flex-col items-center justify-between gap-4 rounded-2xl border border-primary/10 bg-surface p-4 sm:flex-row"
>
  <div class="flex flex-wrap items-center gap-3 text-xs text-text">
    <p>عرض {{ firstItem() }}–{{ lastItem() }} من {{ facade.totalCount() }} حركة</p>
    <label class="flex items-center gap-2"
      >عدد الصفوف
      <select
        [value]="facade.pageSize()"
        (change)="changeSize($event)"
        [disabled]="facade.loadingReport()"
        class="min-h-9 rounded-lg border border-primary/20 bg-surface px-2 py-1 text-text"
      >
        <option [value]="10">10</option>
        <option [value]="25">25</option>
        <option [value]="50">50</option>
      </select>
    </label>
  </div>
  <nav aria-label="صفحات الحركات المالية" class="flex flex-wrap items-center gap-1">
    <button
      type="button"
      (click)="facade.setPage(facade.pageNumber() - 1)"
      [disabled]="facade.loadingReport() || facade.pageNumber() <= 1"
      class="min-h-9 rounded-lg border border-primary/20 px-3 text-xs font-semibold text-text disabled:opacity-50"
    >
      السابق
    </button>
    @for (page of pages(); track page) {
      <button
        type="button"
        (click)="facade.setPage(page)"
        [disabled]="facade.loadingReport()"
        [attr.aria-label]="'الصفحة ' + page"
        [attr.aria-current]="page === facade.pageNumber() ? 'page' : null"
        [class.bg-primary]="page === facade.pageNumber()"
        [class.text-white]="page === facade.pageNumber()"
        [class.text-text]="page !== facade.pageNumber()"
        class="min-h-9 min-w-9 rounded-lg border border-primary/20 px-2 text-xs font-bold"
      >
        {{ page }}
      </button>
    }
    <button
      type="button"
      (click)="facade.setPage(facade.pageNumber() + 1)"
      [disabled]="facade.loadingReport() || facade.pageNumber() >= facade.totalPages()"
      class="min-h-9 rounded-lg border border-primary/20 px-3 text-xs font-semibold text-text disabled:opacity-50"
    >
      التالي
    </button>
  </nav>
</div>
