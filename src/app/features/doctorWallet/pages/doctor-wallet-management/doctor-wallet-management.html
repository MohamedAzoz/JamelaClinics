<div class="min-h-screen p-4 sm:p-6 lg:p-8" dir="rtl">
  @if (facade.canView()) {
    <div class="mx-auto flex max-w-7xl flex-col gap-6">
      <app-wallet-header />
      <app-wallet-filters />
      <app-wallet-summary />
      <app-wallet-table />
      <app-wallet-pagination />
    </div>
    @if (facade.canManage()) {
      @if (facade.actionTarget(); as target) {
        <app-wallet-transaction-modal [target]="target" />
      }
    }
  } @else {
    <p role="alert" class="rounded-2xl border border-danger/20 bg-surface p-6 text-text">
      تعذر عرض الحساب المالي. تأكد من تسجيل الدخول بحساب يملك صلاحية الوصول.
    </p>
  }
</div>
