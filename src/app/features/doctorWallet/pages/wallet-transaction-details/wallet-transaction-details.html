<main class="min-h-screen px-4 py-6 text-text sm:px-6 lg:px-8" dir="rtl">
  <div class="mx-auto flex max-w-5xl flex-col gap-6">
    <app-wallet-transaction-details-header />

    @if (facade.loadingTransactionDetails()) {
      <section
        class="flex min-h-72 flex-col items-center justify-center gap-4 rounded-3xl border border-primary/10 bg-surface p-8 shadow-sm"
        role="status"
      >
        <fa-icon [icon]="faSpinner" class="animate-spin text-3xl text-primary"></fa-icon>
        <p class="text-sm font-semibold text-text-muted">جاري تحميل تفاصيل الحركة...</p>
      </section>
    } @else if (facade.transactionDetailsError()) {
      <section
        class="flex min-h-72 flex-col items-center justify-center rounded-3xl border border-danger/20 bg-surface p-8 text-center shadow-sm"
        role="alert"
      >
        <span
          class="mb-4 flex h-14 w-14 items-center justify-center rounded-2xl bg-danger/10 text-danger"
        >
          <fa-icon [icon]="faExclamationCircle" class="text-2xl"></fa-icon>
        </span>
        <h2 class="text-lg font-bold">تعذر عرض تفاصيل الحركة</h2>
        <p class="mt-2 max-w-md text-sm leading-6 text-text-muted">
          {{ facade.transactionDetailsError() }}
        </p>
      </section>
    } @else if (facade.transactionDetails(); as transaction) {
      <app-wallet-transaction-details-card [transaction]="transaction" />
    }
  </div>
</main>
