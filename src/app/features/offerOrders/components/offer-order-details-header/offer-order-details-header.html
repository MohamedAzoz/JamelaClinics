<header
  class="flex flex-col sm:flex-row sm:items-center justify-between gap-4 p-6 rounded-2xl bg-surface border border-slate-200/80 dark:border-slate-800/80 shadow-xs"
  dir="rtl"
>
  <div class="flex items-center gap-4">
    <button
      type="button"
      (click)="goBack()"
      class="flex h-11 w-11 shrink-0 items-center justify-center rounded-xl border border-slate-200 dark:border-slate-800 bg-main-bg text-text hover:bg-slate-100 dark:hover:bg-slate-800 transition focus-visible:outline-2 focus-visible:outline-primary"
      aria-label="الرجوع للصفحة السابقة"
    >
      <fa-icon [icon]="faArrowRight" class="text-base"></fa-icon>
    </button>
    <div>
      <div class="flex items-center gap-2">
        <span class="flex h-7 w-7 items-center justify-center rounded-lg bg-primary/10 text-primary">
          <fa-icon [icon]="faFileInvoiceDollar" class="text-xs"></fa-icon>
        </span>
        <h1 class="text-xl font-bold text-text">تفاصيل أمر الشراء</h1>
        @if (orderId()) {
          <span class="rounded-lg bg-main-bg px-2.5 py-0.5 font-mono text-xs font-bold text-text-muted border border-slate-200/60 dark:border-slate-800/60">
            #{{ orderId() }}
          </span>
        }
      </div>
      <p class="mt-1 text-xs text-text-muted">
        بيانات وتفاصيل القيمة المسحوبة من الخزينة والدفعات المسجلة للطلب
      </p>
    </div>
  </div>

  <div class="flex items-center gap-2">
    <button
      type="button"
      (click)="refresh()"
      [disabled]="facade.loadingOrderDetails()"
      class="inline-flex items-center gap-2 px-4 py-2.5 text-xs font-semibold text-text border border-slate-200 dark:border-slate-800 rounded-xl hover:bg-slate-50 dark:hover:bg-slate-800/50 transition disabled:opacity-50"
    >
      <fa-icon
        [icon]="faRotateRight"
        [class.animate-spin]="facade.loadingOrderDetails()"
      ></fa-icon>
      <span>تحديث البيانات</span>
    </button>
  </div>
</header>
