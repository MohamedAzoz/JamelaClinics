<div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-4 mb-2.5" dir="rtl">
  <!-- Total Orders Count -->
  <div
    class="p-5 rounded-2xl bg-surface border border-slate-200/80 dark:border-slate-800/80 shadow-xs flex items-center gap-4 hover:shadow-md transition-shadow"
  >
    <div
      class="w-12 h-12 rounded-xl bg-primary/10 text-primary dark:text-accent flex items-center justify-center text-lg shrink-0"
    >
      <fa-icon [icon]="faBoxesPacking"></fa-icon>
    </div>
    <div>
      <p class="text-xs font-medium text-text-muted">إجمالي عدد الطلبات</p>
      <h3 class="text-xl font-bold text-text mt-0.5">
        {{ facade.totalOrdersCount() }}
        <span class="text-xs text-text-muted font-normal">طلب</span>
      </h3>
    </div>
  </div>

  <!-- Total Amount -->
  <div
    class="p-5 rounded-2xl bg-surface border border-slate-200/80 dark:border-slate-800/80 shadow-xs flex items-center gap-4 hover:shadow-md transition-shadow"
  >
    <div
      class="w-12 h-12 rounded-xl bg-accent/10 text-accent flex items-center justify-center text-lg shrink-0"
    >
      <fa-icon [icon]="faCoins"></fa-icon>
    </div>
    <div>
      <p class="text-xs font-medium text-text-muted">إجمالي قيمة الطلبات</p>
      <h3 class="text-xl font-bold text-text mt-0.5">
        {{ facade.totalOrdersAmount() | number: '1.2-2' }}
        <span class="text-xs text-text-muted font-normal">ج.م</span>
      </h3>
    </div>
  </div>

  <!-- Total Paid -->
  <div
    class="p-5 rounded-2xl bg-surface border border-slate-200/80 dark:border-slate-800/80 shadow-xs flex items-center gap-4 hover:shadow-md transition-shadow"
  >
    <div
      class="w-12 h-12 rounded-xl bg-success/10 text-success flex items-center justify-center text-lg shrink-0"
    >
      <fa-icon [icon]="faCreditCard"></fa-icon>
    </div>
    <div>
      <p class="text-xs font-medium text-text-muted">المبلغ المدفوع</p>
      <h3 class="text-xl font-bold text-success mt-0.5">
        {{ facade.totalPaidAmount() | number: '1.2-2' }}
        <span class="text-xs text-success/70 font-normal">ج.م</span>
      </h3>
    </div>
  </div>

  <!-- Total Remaining -->
  <div
    class="p-5 rounded-2xl bg-surface border border-slate-200/80 dark:border-slate-800/80 shadow-xs flex items-center gap-4 hover:shadow-md transition-shadow"
  >
    <div
      class="w-12 h-12 rounded-xl bg-warning/10 text-warning flex items-center justify-center text-lg shrink-0"
    >
      <fa-icon [icon]="faReceipt"></fa-icon>
    </div>
    <div>
      <p class="text-xs font-medium text-text-muted">المبلغ المتبقي</p>
      <h3
        class="text-xl font-bold mt-0.5"
        [class.text-warning]="facade.totalRemainingAmount() > 0"
        [class.text-text-muted]="facade.totalRemainingAmount() === 0"
      >
        {{ facade.totalRemainingAmount() | number: '1.2-2' }}
        <span
          class="text-xs font-normal"
          [class.text-warning]="facade.totalRemainingAmount() > 0"
          [class.text-text-muted]="facade.totalRemainingAmount() === 0"
          >ج.م</span
        >
      </h3>
    </div>
  </div>
</div>
