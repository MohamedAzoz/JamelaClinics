<header
  class="flex items-center gap-4 px-3 sm:px-6 h-16 bg-surface/85 border-b border-text/5 relative z-20"
>
  <!-- Mobile Menu Toggle -->
  <button
    class="flex lg:hidden items-center justify-center w-10 h-10 border-none rounded-xl bg-transparent text-text-muted cursor-pointer transition-colors shrink-0 hover:bg-primary/10 hover:text-primary"
    (click)="toggleMobileSidebar.emit()"
  >
    <fa-icon [icon]="faBars"></fa-icon>
  </button>

  <!-- Spacer -->
  <div class="flex-1"></div>

  <!-- Actions -->
  <div class="flex items-center gap-1.5 shrink-0">
    <!-- #region Language Toggle -->
    <!-- 
    <button
      type="button"
      class="group relative inline-flex items-center gap-1.5 h-9 rounded-full border border-gray-200 bg-mode-toggle-bg px-3 text-sm font-semibold text-text-dark shadow-sm transition-all duration-200 hover:-translate-y-0.5 hover:border-primary/40 hover:bg-mode-toggle-hover-bg hover:text-primary hover:shadow-md focus-visible:outline-2 focus-visible:outline-primary/50 cursor-pointer md:h-10"
      (click)="switchLanguage()"
      [attr.aria-label]="
        translocoService.getActiveLang() === 'ar' ? 'Switch to English' : 'التبديل إلى العربية'
      "
      [attr.title]="
        translocoService.getActiveLang() === 'ar' ? 'Switch to English' : 'التبديل إلى العربية'
      "
    >
      <fa-icon
        [icon]="faGlobe"
        size="sm"
        class="text-primary transition-transform duration-300 group-hover:rotate-25"
        aria-hidden="true"
      ></fa-icon>
      <span class="hidden sm:inline transition-all duration-200">{{
        translocoService.getActiveLang() === 'ar' ? 'EN' : 'ع'
      }}</span>
    </button> -->

    <!-- #endregion -->

    <!-- #region theme toggle -->
    <button
      type="button"
      class="group btn relative inline-flex h-9 w-9 items-center justify-center overflow-hidden rounded-full border border-gray-200 bg-mode-toggle-bg text-text-secondary shadow-sm transition-all duration-200 hover:-translate-y-0.5 hover:border-primary/40 hover:bg-mode-toggle-hover-bg hover:text-primary hover:shadow-md focus-visible:outline-2 focus-visible:outline-primary/50 md:h-10 md:w-10 lg:hidden"
      [attr.aria-label]="themeLabel()"
      [attr.title]="themeLabel()"
      (click)="toggleTheme()"
    >
      <fa-icon [icon]="isDark() ? faSun : faMoon" size="sm" aria-hidden="true"></fa-icon>
    </button>

    <button
      type="button"
      class="hidden btn items-center gap-2 rounded-full border border-gray-200 bg-mode-toggle-bg px-3 py-2 text-sm font-semibold text-text-dark shadow-sm transition-all duration-200 hover:-translate-y-0.5 hover:border-primary/40 hover:bg-mode-toggle-hover-bg hover:text-primary hover:shadow-md focus-visible:outline-2 focus-visible:outline-primary/50 lg:inline-flex"
      [attr.aria-label]="themeLabel()"
      [attr.title]="themeLabel()"
      (click)="toggleTheme()"
    >
      <fa-icon [icon]="isDark() ? faSun : faMoon" size="sm" aria-hidden="true"></fa-icon>
      <span>{{ desktopThemeLabel() }}</span>
    </button>

    <!-- #endregion -->

    <!-- #region User Menu -->

    <div class="relative">
      <button
        class="flex items-center gap-1.5 p-1 pr-2 border-none rounded-xl bg-transparent text-text-muted cursor-pointer transition-colors hover:bg-primary/10"
        [class.!bg-primary_10]="isUserMenuOpen()"
        (click)="toggleUserMenu()"
      >
        <div
          class="w-9 h-9 rounded-xl bg-linear-to-br from-primary to-accent flex items-center justify-center shrink-0"
        >
          <fa-icon [icon]="faUser"></fa-icon>
        </div>
        <fa-icon
          class="w-4 h-4 transition-transform duration-200"
          [class.rotate-180]="isUserMenuOpen()"
          [icon]="faAngleUp"
        ></fa-icon>
      </button>

      @if (isUserMenuOpen()) {
        <div
          class="fixed inset-x-3 top-18 sm:absolute sm:inset-auto sm:top-[calc(100%+8px)] sm:inset-e-0 w-auto sm:w-60 bg-surface border border-text/10 rounded-2xl shadow-xl overflow-hidden z-50 animate-dropdown-in"
        >
          <div class="flex items-center justify-start gap-3 py-3.5 px-4 border-b border-text/5">
            <div
              class="w-11 h-11 rounded-xl bg-linear-to-br from-primary to-accent flex items-center justify-center shrink-0"
            >
              <fa-icon [icon]="faUser"></fa-icon>
            </div>
            <div class="min-w-0">
              <p class="font-bold text-[0.85rem] text-text m-0 truncate">
                {{ idntity.userName() }}
              </p>
              <p class="text-[0.7rem] text-text-muted m-0">{{ idntity.userRole() }}</p>
            </div>
          </div>
          <div class="p-1.5">
            <a
              routerLink="/profile"
              (click)="closeAllMenus()"
              class="flex items-center gap-2.5 p-2.5 rounded-xl no-underline text-[0.8rem] text-text-muted cursor-pointer transition-colors hover:bg-primary/5 hover:text-primary"
            >
              <fa-icon [icon]="faUser"></fa-icon>
              <span>الملف الشخصي</span>
            </a>
            <div class="h-px bg-text/5 my-1 mx-3"></div>
            <a
              (click)="logout()"
              class="flex items-center gap-2.5 p-2.5 rounded-xl no-underline text-[0.8rem] text-text-muted cursor-pointer transition-colors hover:bg-danger/10 hover:text-danger"
            >
              <fa-icon [icon]="faSignOut"></fa-icon>
              <span>تسجيل الخروج</span>
            </a>
          </div>
        </div>
      }
    </div>

    <!-- #endregion -->
  </div>
</header>

<!-- Backdrop for closing dropdowns -->
@if (isUserMenuOpen()) {
  <div class="fixed inset-0 z-10" (click)="closeAllMenus()"></div>
}
