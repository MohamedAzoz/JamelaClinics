@if (loadingService.isLoading()) {
  <div
    class="fixed inset-0 flex items-center justify-center bg-main-bg/92 backdrop-blur-lg z-9999"
    aria-hidden="true"
  >
    <div class="flex flex-col items-center gap-6 relative select-none">
      <!-- Logo & Pulse Rings Container -->
      <div class="w-20 h-20 flex items-center justify-center relative">
        <!-- Pulse Rings (Centered Automatically) -->
        <div class="absolute inset-0 flex items-center justify-center pointer-events-none">
          <div class="pulse-ring" style="--ring-delay: 0s; --ring-size: 80px"></div>
          <div class="pulse-ring" style="--ring-delay: 0.5s; --ring-size: 120px"></div>
          <div class="pulse-ring" style="--ring-delay: 1s; --ring-size: 160px"></div>
        </div>

        <!-- Medical Logo with Smart Shadow -->
        <div
          class="w-16 h-16 rounded-full bg-primary/5 flex items-center justify-center relative z-10 animate-heartbeat shadow-lg shadow-primary/10"
        >
          <!-- [ngSrc]="isDark() ? '/jamela.webp' : '/Logo.webp'" -->
          <img
            [ngSrc]="'/jamela.webp'"
            width="100"
            height="100"
            priority
            [alt]="'شعار ' + title"
            class="w-full h-full rounded-full object-contain"
          />
        </div>
      </div>

      <!-- Text Indicator -->
      <div class="flex items-baseline gap-0.5 relative z-10 text-text-muted">
        <p class="font-bold text-base m-0 leading-none">{{ loadingText() }}</p>
        <span class="flex gap-0.5 leading-none" aria-hidden="true">
          <span class="font-bold text-lg text-primary animate-dot" style="--dot-delay: 0s">.</span>
          <span class="font-bold text-lg text-primary animate-dot" style="--dot-delay: 0.2s"
            >.</span
          >
          <span class="font-bold text-lg text-primary animate-dot" style="--dot-delay: 0.4s"
            >.</span
          >
        </span>
      </div>

      <!-- Infinite Indeterminate Progress Bar -->
      <div class="w-45 h-1 rounded-full bg-primary/10 overflow-hidden relative z-10">
        <div
          class="h-full w-1/2 rounded-full bg-linear-to-r from-primary via-accent to-primary animate-bar-slide"
        ></div>
      </div>
    </div>
  </div>
}
